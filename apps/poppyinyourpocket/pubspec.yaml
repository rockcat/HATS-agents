name: poppy
description: "Poppy In Your Pocket — a single agent with a face, driven by the Embodiment API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The avatar renderer, shared with apps/flutter/hats.
  hats_avatar_view:
    path: ../flutter/avatar_view

  http: ^1.2.1
  # The API key from QR pairing — keychain on iOS, EncryptedSharedPreferences on Android.
  flutter_secure_storage: ^10.3.1
  mobile_scanner: ^5.2.0
  # Poppy looking at something, as a device tool. Captured at a modest
  # resolution rather than downscaled afterwards: a full-size frame would be
  # decoded and re-encoded for nothing, and a 720p JPEG is what the model wants.
  camera: ^0.11.0+2
  # Speech-to-text runs on the device: Poppy hears you with no connection.
  speech_to_text: ^7.4.0
  # The platform voice: instant, offline, no server round trip.
  flutter_tts: ^4.2.0
  # Playback of the WAV the Speech Service returns, per sentence.
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1
  provider: ^6.1.2

  # Knowing who Poppy is talking to, without the face leaving the phone.
  #
  # Two models doing different jobs: ML Kit finds *where* a face is, and
  # MobileFaceNet through LiteRT says *who* it is. LiteRT is what TensorFlow
  # Lite is called now, and flutter_litert bundles runtimes for Android, iOS,
  # macOS, Windows, Linux and the web — so the same .tflite file works in
  # every build of this app.
  google_mlkit_face_detection: ^0.13.1
  flutter_litert: ^3.9.4
  # Decoding the still and cropping it. The crop has to match the browser's
  # to the pixel or the two write incomparable vectors into one register.
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # The recognition model. Not committed — it decides the embedding space
    # every stored face lives in, so it is pinned with the build rather than
    # downloaded at runtime. See docs/face-recognition.md.
    - assets/models/
